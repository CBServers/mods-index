name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}

      # Latest main, not the triggering commit, so a queued run never pushes over a newer one.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Configure git
        run: |
          git config user.name "${{ steps.app.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Hash new files
        id: hash
        run: |
          set +e
          python scripts/publish.py --hash --summary "$GITHUB_STEP_SUMMARY"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Commit hashes
        run: |
          if [ -z "$(git status --porcelain -- items)" ]; then exit 0; fi
          git add items
          git commit -m "fill hashes [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Build the indexes
        id: build
        run: |
          set +e
          python scripts/publish.py --dist "$RUNNER_TEMP/dist" --summary "$GITHUB_STEP_SUMMARY"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # dist holds one orphan commit, force-pushed on every publish.
      - name: Push the dist branch
        run: |
          if [ ! -d "$RUNNER_TEMP/dist" ]; then echo "nothing built"; exit 0; fi
          source="$(git rev-parse --short HEAD)"
          git worktree add --detach "$RUNNER_TEMP/dist-branch"
          cd "$RUNNER_TEMP/dist-branch"
          git checkout -q --orphan dist
          git rm -rfq .
          mkdir dist
          cp "$RUNNER_TEMP"/dist/*.json dist/
          git add dist
          git commit -qm "build $source"
          git push -f origin dist

      - name: Tell the workshop worker
        env:
          REFRESH_URL: ${{ vars.WORKSHOP_REFRESH_URL }}
          REFRESH_SECRET: ${{ secrets.WORKSHOP_REFRESH_SECRET }}
        run: |
          if [ -z "$REFRESH_URL" ]; then echo "WORKSHOP_REFRESH_URL not set, skipping"; exit 0; fi
          curl -fsS -m 30 -X POST -H "Authorization: Bearer $REFRESH_SECRET" "$REFRESH_URL" || echo "refresh failed; the worker's cron will pick it up"

      - name: Fail on publish errors
        if: steps.hash.outputs.status != '0' || steps.build.outputs.status != '0'
        run: exit 1
